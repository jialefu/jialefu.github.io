bio: >-
  Jiale Fu is a master's student at Southeast University and PALM Lab, where he studies how to make large language models faster and more reliable at inference time. His current work centers on speculative decoding, collaborative decoding, and retrieval mechanisms that improve multi-step reasoning. Before graduate school, he completed a mathematics degree at Southeast University and worked on multimodal and reasoning systems during internships at Shopee R&D Center and Baidu Research.
