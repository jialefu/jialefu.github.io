<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">Mixture Ensembling</title>
<desc id="desc">A mixture selector samples a single model per decoding step. The highlighted path generates the next token.</desc>
