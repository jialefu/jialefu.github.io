<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">CoS</title>
<desc id="desc">Two collaborators propose token sequences. A target model verifies proposals and accepts a sequence of tokens.</desc>
