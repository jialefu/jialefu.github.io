<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">Flatter Tokens</title>
<desc id="desc">Qualitative sharp and flat token distributions illustrate selecting informative flatter tokens to form a compact draft-model training set.</desc>
