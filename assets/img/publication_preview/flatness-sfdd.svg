 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto-start-reverse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="#397fc6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="640" height="480" fill="url(#paper)"/>
<rect x="24" y="110" width="592" height="306" fill="url(#dots)" opacity=".55"/>
