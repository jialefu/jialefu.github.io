name: Deploy site

on:
  push:
    branches:
      - master
      - main
      - al-folio-rebuild
  pull_request:
    branches:
      - master
      - main
      - al-folio-rebuild
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure GitHub Pages uses workflow deployments
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pages"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def request(method, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  body = response.read().decode("utf-8")
                  return response.status, json.loads(body) if body else None

          desired = {"build_type": "workflow", "source": {"branch": ref_name, "path": "/"}}

          try:
              _, current = request("GET")
              build_type = current.get("build_type")
              source = current.get("source") or {}
              print(f"Current Pages config: build_type={build_type}, source={source}")

              if build_type == "workflow" and source.get("branch") == ref_name and source.get("path") == "/":
                  print("GitHub Pages is already configured for workflow deployments.")
              else:
                  try:
                      request("PUT", desired)
                      print(f"::notice::Updated GitHub Pages to workflow mode on branch '{ref_name}'.")
                  except urllib.error.HTTPError as error:
                      details = error.read().decode("utf-8", errors="replace")
                      print(
                          "::warning::GitHub Pages is not in workflow mode and the workflow could not update it "
                          f"automatically ({error.code}). Response: {details}"
                      )
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              if error.code == 404:
                  try:
                      request("POST", desired)
                      print(f"::notice::Created a GitHub Pages site in workflow mode on branch '{ref_name}'.")
                  except urllib.error.HTTPError as create_error:
                      create_details = create_error.read().decode("utf-8", errors="replace")
                      print(
                          "::warning::GitHub Pages is not configured yet and the workflow could not create it "
                          f"automatically ({create_error.code}). Response: {create_details}"
                      )
              else:
                  print(
                      "::warning::Could not inspect GitHub Pages settings before deployment "
                      f"({error.code}). Response: {details}"
                  )
          PY
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Update _config.yml
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and build
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          bundle exec jekyll build
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
